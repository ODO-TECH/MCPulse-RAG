services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage/qdrant:/qdrant/storage

  knowledge-mcp:
    build:
      context: ./knowledge-mcp
    container_name: knowledge-mcp
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "6646:6646"
    env_file:
      - ./knowledge-mcp/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      KB_DATA_DIR: /data/mcpdata
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "6646"
    volumes:
      - ${KB_SOURCE_DIR:-/vol3/1000/RAGdata}:/data/mcpdata:ro
      - ./storage/index_state:/app/state

  ragcheck:
    build:
      context: ./RAGcheck
    container_name: ragcheck
    restart: unless-stopped
    depends_on:
      - qdrant
      - knowledge-mcp
    env_file:
      - ./RAGcheck/.env
    environment:
      MCP_CHECK_URL: http://knowledge-mcp:6646
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./storage/reports:/app/reports

