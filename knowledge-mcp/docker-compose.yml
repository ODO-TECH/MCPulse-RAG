services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  knowledge-mcp:
    build: .
    container_name: knowledge-mcp
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "6646:6646"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      KB_DATA_DIR: /data/mcpdata
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "6646"
    volumes:
      - /absolute/path/to/your/rag-data:/data/mcpdata:ro
      - ./app:/app
      - index_state:/app/state

volumes:
  index_state:
