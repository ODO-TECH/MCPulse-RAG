server:
  host: "0.0.0.0"
  port: 6646

qdrant:
  host: ${QDRANT_HOST}
  port: ${QDRANT_PORT}

models:
  api_base: ${SILICONFLOW_API_BASE}
  embed_model: ${EMBED_MODEL}
  rerank_model: ${RERANK_MODEL}

knowledge:
  root: ${KB_DATA_DIR}

  bases:
    - name: knowledge_01
      path: category_01
      collection: kb_category_01
      description: General-purpose knowledge category 01

    - name: knowledge_02
      path: category_02
      collection: kb_category_02
      description: General-purpose knowledge category 02

    - name: knowledge_03
      path: category_03
      collection: kb_category_03
      description: General-purpose knowledge category 03

    - name: knowledge_04
      path: category_04
      collection: kb_category_04
      description: General-purpose knowledge category 04

retrieval:
  similarity_top_k: 12
  rerank_top_n: 5
  chunk_size: 800
  chunk_overlap: 150

watcher:
  debounce_seconds: 30

files:
  include_extensions:
    - .md
    - .txt
    - .pdf
    - .docx
    - .doc
